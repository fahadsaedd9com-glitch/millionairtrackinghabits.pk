# Render Blueprint: one web service (frontend + API) with a persistent disk for SQLite.
# Persistent disks require a PAID instance type on Render (the free plan has an ephemeral filesystem).
services:
  - type: web
    name: millionaire-tracking-habits
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true
      - key: DB_FILE
        value: /var/data/habits.db
    disk:
      name: habits-data
      mountPath: /var/data
      sizeGB: 1
